# Cloud Foundry UAA — the open-source server XSUAA is built from — as a local
# stand for the SAML 2.0 bearer grant (RFC 7522). `up.sh` renders the
# configuration and keys into .generated/ first; start it through that script.
services:
  uaa:
    image: docker.io/cfidentity/uaa:v79.7.0
    container_name: auth-providers-uaa
    ports:
      - "127.0.0.1:${UAA_PORT:-8080}:8080"
    environment:
      CLOUDFOUNDRY_CONFIG_PATH: /config
      SECRETS_DIR: /secrets
      SERVER_SERVLET_CONTEXT_PATH: /uaa
    volumes:
      - ./.generated/config:/config:ro
      - ./.generated/secrets:/secrets:ro
