# The provider test stand: Cloud Foundry UAA — the open-source server XSUAA is
# built from — and Keycloak, each on the loopback address only. up.sh renders
# UAA's configuration and keys into .generated/ first; start the stand through
# that script, or through run.sh.
services:
  uaa:
    image: docker.io/cfidentity/uaa:v79.7.0
    container_name: auth-providers-uaa
    ports:
      - "127.0.0.1:${UAA_PORT:-8080}:8080"
    environment:
      CLOUDFOUNDRY_CONFIG_PATH: /config
      SECRETS_DIR: /secrets
      SERVER_SERVLET_CONTEXT_PATH: /uaa
    volumes:
      - ./.generated/config:/config:ro
      - ./.generated/secrets:/secrets:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: auth-providers-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-test.json:/opt/keycloak/data/import/realm-test.json:ro
