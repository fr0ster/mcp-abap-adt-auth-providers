# The stand's Negotiate-only service. Selected by the Host header:
#
# negotiate.stand.test (the default host)
#   /sap           200 only to an accepted Negotiate token, from the keytab of
#                  HTTP/negotiate.stand.test; Kerberos only (GssapiAllowedMech
#                  krb5), the replay cache on (MIT's default for an acceptor);
#                  the accepted user echoed in X-Remote-User (its local name:
#                  the realm is the default one, so alice@STAND.TEST is alice).
#   /continuation  401 to every request, with a fixed, non-empty
#                  WWW-Authenticate: Negotiate <base64> — a configured answer
#                  standing for a continuation, not a GSS exchange Apache
#                  produced. The token is a NegTokenResp (accept-incomplete,
#                  Kerberos), built for the stand.
# stale.stand.test
#   /sap           as above, from the stale keytab: the KDC changed that
#                  service's key after the keytab was exported (kdc/start.sh),
#                  so every ticket for it is refused.
ServerName negotiate.stand.test
LogLevel warn auth_gssapi:debug
ErrorLog /dev/stderr
TransferLog /dev/stdout

<VirtualHost *:80>
  ServerName negotiate.stand.test
  DocumentRoot /var/www/html
  <Location /sap>
    AuthType GSSAPI
    AuthName "negotiate.stand.test"
    GssapiCredStore keytab:/keytabs/negotiate.keytab
    GssapiAllowedMech krb5
    GssapiBasicAuth Off
    GssapiLocalName On
    Require valid-user
    Header always set X-Remote-User "expr=%{REMOTE_USER}"
  </Location>
  RewriteEngine On
  RewriteRule ^/continuation - [R=401,L]
  <Location /continuation>
    Header always set WWW-Authenticate "Negotiate oRQwEqADCgEBoQsGCSqGSIb3EgECAg=="
  </Location>
</VirtualHost>

<VirtualHost *:80>
  ServerName stale.stand.test
  DocumentRoot /var/www/html
  <Location /sap>
    AuthType GSSAPI
    AuthName "stale.stand.test"
    GssapiCredStore keytab:/keytabs/stale.keytab
    GssapiAllowedMech krb5
    GssapiBasicAuth Off
    GssapiLocalName On
    Require valid-user
    Header always set X-Remote-User "expr=%{REMOTE_USER}"
  </Location>
</VirtualHost>
