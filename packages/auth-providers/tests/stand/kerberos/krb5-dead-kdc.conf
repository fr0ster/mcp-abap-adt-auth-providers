# The same realm as krb5.conf, with a KDC address nothing listens on: the
# loopback of the client container itself, where no KDC runs. The suite hands
# it to a child process (KRB5_CONFIG) whose cache already holds alice's TGT,
# so the one request left — the service ticket — finds no KDC.
[libdefaults]
  default_realm = STAND.TEST
  dns_lookup_realm = false
  dns_lookup_kdc = false
  rdns = false
  dns_canonicalize_hostname = false

[realms]
  STAND.TEST = {
    kdc = 127.0.0.1:88
  }

[domain_realm]
  .stand.test = STAND.TEST
  stand.test = STAND.TEST
