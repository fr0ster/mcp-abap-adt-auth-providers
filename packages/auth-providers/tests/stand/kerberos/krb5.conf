# The Kerberos stand's client configuration, static: every name is one of the
# stand's Docker network (compose.yaml), so nothing is rendered at run time.
# A throwaway realm, trusted by nothing but the stand.
[libdefaults]
  default_realm = STAND.TEST
  dns_lookup_realm = false
  dns_lookup_kdc = false
  rdns = false
  dns_canonicalize_hostname = false
  # One clock on the stand; the default tolerance stays.

[realms]
  STAND.TEST = {
    kdc = kdc.stand.test
    admin_server = kdc.stand.test
  }

[domain_realm]
  .stand.test = STAND.TEST
  stand.test = STAND.TEST
