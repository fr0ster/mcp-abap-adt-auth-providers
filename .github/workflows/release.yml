name: Release

on:
  push:
    tags:
      # <package directory>-v<version>, as tools/publish-changed.js tags
      - 'auth-providers-v*.*.*'
      - 'auth-spnego-gssapi-v*.*.*'

permissions:
  contents: write  # Required for creating releases

jobs:
  release-auth-providers:
    if: startsWith(github.ref_name, 'auth-providers-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/auth-providers-v}"
          VERSION="$(node -p "require('./packages/auth-providers/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag auth-providers-v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/auth-providers
        run: npm ci --ignore-scripts

      - name: Build project
        working-directory: packages/auth-providers
        run: npm run build

      - name: Shape check
        working-directory: packages/auth-providers
        run: npm run test:shape

      - name: Create package
        working-directory: packages/auth-providers
        run: npm pack

      - name: Get package filename
        id: package
        run: |
          PACKAGE_FILE=$(cd packages/auth-providers && ls mcp-abap-adt-auth-providers-*.tgz)
          echo "filename=$PACKAGE_FILE" >> $GITHUB_OUTPUT
          echo "Package created: $PACKAGE_FILE"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/auth-providers-v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: packages/auth-providers/${{ steps.package.outputs.filename }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            Download the `.tgz` package and install:

            ```bash
            npm install -g ./${{ steps.package.outputs.filename }}
            ```

            ## What's Changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-auth-spnego-gssapi:
    if: startsWith(github.ref_name, 'auth-spnego-gssapi-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/auth-spnego-gssapi-v}"
          VERSION="$(node -p "require('./packages/auth-spnego-gssapi/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag auth-spnego-gssapi-v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/auth-spnego-gssapi
        run: npm ci --ignore-scripts

      - name: Build project
        working-directory: packages/auth-spnego-gssapi
        run: npm run build

      - name: Create package
        working-directory: packages/auth-spnego-gssapi
        run: npm pack

      - name: Get package filename
        id: package
        run: |
          PACKAGE_FILE=$(cd packages/auth-spnego-gssapi && ls mcp-abap-adt-auth-spnego-gssapi-*.tgz)
          echo "filename=$PACKAGE_FILE" >> $GITHUB_OUTPUT
          echo "Package created: $PACKAGE_FILE"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/auth-spnego-gssapi-v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: packages/auth-spnego-gssapi/${{ steps.package.outputs.filename }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            Download the `.tgz` package and install:

            ```bash
            npm install -g ./${{ steps.package.outputs.filename }}
            ```

            ## What's Changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
