name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Saml2BearerProvider against a real Cloud Foundry UAA, started in Docker by
  # tests/uaa/run.sh and stopped again when the suite ends.
  uaa-saml-bearer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test against UAA
        run: npm run test:uaa

      - name: UAA logs on failure
        if: failure()
        run: docker compose -f tests/uaa/compose.yaml logs --tail 200
